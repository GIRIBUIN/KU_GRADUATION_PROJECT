name: KU Todo Android test APK
on:
  push:
    branches: [build/android-apk-a65429a3]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a65429a3dd9f2af93af12f0ff7270fb5342357eb
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Build arm64 Android APK
        run: |
          flutter pub get
          flutter build apk --debug --no-pub --target-platform android-arm64 --build-number 4
          mkdir -p deliverable
          cp build/app/outputs/flutter-apk/app-debug.apk deliverable/KUTODO-a65429a3-android-arm64.apk
      - name: Verify Android package and signature
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=deliverable/KUTODO-a65429a3-android-arm64.apk
          "$tools/apksigner" verify "$apk"
          "$tools/aapt" dump badging "$apk" | grep -E '^(package|sdkVersion|targetSdkVersion|native-code):'
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: KUTODO-a65429a3-android-arm64
          path: deliverable/*.apk
          if-no-files-found: error
          retention-days: 3
